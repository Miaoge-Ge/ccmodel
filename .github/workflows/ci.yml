name: ci
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["20", "22", "24"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install dev deps
        run: npm install
      - name: Type-check + build
        run: npm run build
      - name: Offline self-test
        run: node --test "dist/test/**/*.test.js"
      - name: Doctor (config validation, skip nested test)
        run: node dist/scripts/doctor.js --no-test --ci
